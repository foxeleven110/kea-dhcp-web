services:
  kea-dhcp-go:
    build: .
    image: kea-dhcp-go:latest
    container_name: kea-dhcp-go
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      KEA_LISTEN: 0.0.0.0:8080
      KEA_URL: ${KEA_URL:-http://192.168.6.94:8000}
      KEA_USER: ${KEA_USER:-admin}
      KEA_PASS: ${KEA_PASS:?请在 .env 中设置 KEA_PASS}
      KEA_OPEN_BROWSER: "false"
    volumes:
      - kea-data:/data
    restart: unless-stopped

volumes:
  kea-data:
